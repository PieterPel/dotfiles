# Agent Package Manager manifest -- https://microsoft.github.io/apm
# Install the CLI:  curl -sSL https://aka.ms/apm-unix | sh
# Sync this file:   apm install
name: dotfiles
version: 0.1.0

dependencies:
  apm:
    # Persistent cross-session memory. Claude Code plugin -- the plugin manifest
    # lives at .claude-plugin/plugin.json in the repo root, so the bare repo ref
    # is enough for APM to pick it up.
    - thedotmack/claude-mem

    # werkboom's own skill, vendored out of the Codeberg monorepo. Not a
    # top-level package, hence the object form with an explicit subpath.
    - git: https://codeberg.org/PieterPel/mono.git
      path: apps/rust/werkboom/.claude/skills/werkboom
      ref: trunk
      alias: werkboom

  mcp:
    # codegraph is not an APM/Claude plugin -- it's a CLI that speaks MCP over
    # stdio, so it's declared here rather than under `apm`. Needs the binary on
    # PATH: npm install -g @colbymchenry/codegraph
    - name: codegraph
      registry: false
      transport: stdio
      command: codegraph
      args: ["serve", "--mcp"]
